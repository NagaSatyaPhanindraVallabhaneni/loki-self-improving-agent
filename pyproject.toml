[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "loki-self-improving-agent"
version = "0.1.0"
description = "A self-improving coding agent: writes code, runs it, learns from the result (portfolio project)"
requires-python = ">=3.10"
dependencies = ["httpx", "pydantic"]

[tool.setuptools.packages.find]
where = ["."]
include = ["loki*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
